name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pyinstaller

    - name: Build Linux executable
      run: |
        pyinstaller --onefile --name RepakGUI-Linux repak_gui.py

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-executable
        path: dist/RepakGUI-Linux

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller

    - name: Build Windows executable
      run: |
        pyinstaller --onefile --windowed --name RepakGUI-Windows repak_gui.py

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/RepakGUI-Windows.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-executable
        path: dist/linux

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-executable
        path: dist/windows

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/linux/RepakGUI-Linux
          dist/windows/RepakGUI-Windows.exe
        body: |
          ## Downloads

          | File | Platform |
          |------|----------|
          | **RepakGUI-Windows.exe** | Windows |
          | **RepakGUI-Linux** | Linux |

          ## Installation

          ### Windows
          Download `RepakGUI-Windows.exe` and run it. Place `repak.exe` in the same directory.

          ### Linux
          Download `RepakGUI-Linux`, make executable: `chmod +x RepakGUI-Linux`, run: `./RepakGUI-Linux`. Place `repak` binary in the same directory.

          ## Keyboard Shortcuts
          `Ctrl+O` Browse | `Ctrl+L` Clear log | `Ctrl+E` Export log | `Ctrl+Q` Quit | `Escape` Cancel

          ---
          Built automatically with GitHub Actions
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions: {}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pyinstaller

    - name: Verify checksum file is current
      run: |
        if [ ! -f checksums.sha256 ]; then
          echo "::error::checksums.sha256 not found"
          exit 1
        fi
        sha256sum -c checksums.sha256

    - name: Build Linux executable
      run: |
        pyinstaller --onefile --name RepakGUI-Linux repak_gui.py

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-executable
        path: dist/RepakGUI-Linux

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
        pip install pyinstaller

    - name: Build Windows executable
      run: |
        pyinstaller --onefile --windowed --name RepakGUI repak_gui.py

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-executable
        path: dist/RepakGUI.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Download Linux artifacts
      uses: actions/download-artifact@v8
      with:
        name: linux-executable
        path: dist/linux

    - name: Download Windows artifacts
      uses: actions/download-artifact@v8
      with:
        name: windows-executable
        path: dist/windows

    - name: Generate SHA256SUMS
      run: |
        sha256sum repak_gui.py > SHA256SUMS
        sha256sum dist/linux/RepakGUI-Linux >> SHA256SUMS
        sha256sum dist/windows/RepakGUI.exe >> SHA256SUMS
        # Normalize paths to filenames only
        sed -i 's|  .*/|  |' SHA256SUMS
        cat SHA256SUMS

    - name: Create Release
      run: |
        gh release create "${{ github.ref_name }}" \
          dist/linux/RepakGUI-Linux \
          dist/windows/RepakGUI.exe \
          SHA256SUMS \
          --title "${{ github.ref_name }}" \
          --notes "$(cat <<'NOTES'
        ## Installation

        ### Windows
        Download `RepakGUI.exe` and run it. Place `repak.exe` in the same directory.

        ### Linux
        Download `RepakGUI-Linux`, make executable: `chmod +x RepakGUI-Linux`, run: `./RepakGUI-Linux`. Place `repak` binary in the same directory.

        ## Keyboard Shortcuts
        `Ctrl+O` Browse | `Ctrl+L` Clear log | `Ctrl+E` Export log | `Ctrl+Q` Quit | `Escape` Cancel

        ---
        Built automatically with GitHub Actions
        NOTES
        )"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepend download disclaimer to release notes
      run: |
        TAG="${{ github.ref_name }}"
        DISCLAIMER=$'## 📥 Downloads\n\n**Just grab one file:**\n- **Windows** → `RepakGUI.exe`\n- **Linux** → `RepakGUI-Linux`\n\nThe `SHA256SUMS` file is an optional checksum for verifying the download — you don\'t need it to use the app.\n\n---\n\n'
        BODY=$(gh release view "$TAG" --json body -q .body)
        printf '%s%s' "$DISCLAIMER" "$BODY" > /tmp/release_notes.md
        gh release edit "$TAG" --notes-file /tmp/release_notes.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
